[project]
name = "interview-to-my-opinion"
version = "0.1.0"
description = "Turn interviews into English retelling material stored in an Obsidian vault"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.10.14",
    "feedparser>=6.0.11",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
itmo = "itmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
